<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">Depth Anything 3 in the Video2Mesh pipeline</title>
  <desc id="desc">DA3 acts as a learned geometry prior that produces depth, camera and point cloud evidence before 3DGS, mesh and semantic lifting stages.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="0.55" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#172554"/>
    </linearGradient>
    <linearGradient id="da3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#93c5fd"/>
    </marker>
  </defs>
  <rect width="1280" height="640" fill="url(#bg)"/>
  <g opacity="0.16">
    <circle cx="118" cy="110" r="78" fill="#38bdf8"/>
    <circle cx="1120" cy="520" r="120" fill="#a78bfa"/>
    <circle cx="930" cy="110" r="90" fill="#34d399"/>
  </g>
  <text x="72" y="82" fill="#f8fafc" font-family="Inter, Arial, sans-serif" font-size="38" font-weight="700">DA3 / Depth Anything 3</text>
  <text x="72" y="122" fill="#cbd5e1" font-family="Inter, Arial, sans-serif" font-size="18">learned depth, camera, point-cloud and optional Gaussian prior for Video2Mesh</text>

  <g font-family="Inter, Arial, sans-serif" filter="url(#shadow)">
    <rect x="70" y="220" width="190" height="128" rx="16" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
    <text x="98" y="268" fill="#f8fafc" font-size="23" font-weight="700">video frames</text>
    <text x="98" y="302" fill="#bfdbfe" font-size="16">images</text>
    <text x="98" y="326" fill="#bfdbfe" font-size="16">optional cameras</text>

    <rect x="338" y="190" width="258" height="190" rx="22" fill="url(#da3)" stroke="#e0f2fe" stroke-width="2"/>
    <text x="390" y="244" fill="#020617" font-size="30" font-weight="800">DA3</text>
    <text x="386" y="280" fill="#0f172a" font-size="17" font-weight="700">plain transformer</text>
    <text x="386" y="306" fill="#0f172a" font-size="17" font-weight="700">unified depth-ray</text>
    <text x="386" y="332" fill="#0f172a" font-size="17" font-weight="700">any-view geometry</text>

    <rect x="690" y="146" width="226" height="92" rx="14" fill="#111827" stroke="#60a5fa" stroke-width="2"/>
    <text x="726" y="184" fill="#f8fafc" font-size="21" font-weight="700">depth + conf</text>
    <text x="726" y="212" fill="#bfdbfe" font-size="15">per-frame dense maps</text>

    <rect x="690" y="274" width="226" height="92" rx="14" fill="#111827" stroke="#60a5fa" stroke-width="2"/>
    <text x="726" y="312" fill="#f8fafc" font-size="21" font-weight="700">camera poses</text>
    <text x="726" y="340" fill="#bfdbfe" font-size="15">w2c + intrinsics</text>

    <rect x="690" y="402" width="226" height="92" rx="14" fill="#111827" stroke="#60a5fa" stroke-width="2"/>
    <text x="726" y="440" fill="#f8fafc" font-size="21" font-weight="700">point cloud</text>
    <text x="726" y="468" fill="#bfdbfe" font-size="15">PLY / GLB / NPZ prior</text>

    <rect x="1010" y="130" width="206" height="92" rx="14" fill="#052e2b" stroke="#34d399" stroke-width="2"/>
    <text x="1040" y="168" fill="#ecfeff" font-size="20" font-weight="700">3DGS init</text>
    <text x="1040" y="196" fill="#bbf7d0" font-size="15">GraphDECO / PGSR</text>

    <rect x="1010" y="274" width="206" height="92" rx="14" fill="#3b2605" stroke="#fbbf24" stroke-width="2"/>
    <text x="1040" y="312" fill="#fff7ed" font-size="20" font-weight="700">mesh fusion</text>
    <text x="1040" y="340" fill="#fde68a" font-size="15">TSDF / Poisson / audit</text>

    <rect x="1010" y="418" width="206" height="92" rx="14" fill="#321344" stroke="#c084fc" stroke-width="2"/>
    <text x="1040" y="456" fill="#faf5ff" font-size="20" font-weight="700">semantic lift</text>
    <text x="1040" y="484" fill="#e9d5ff" font-size="15">masks to 3D bbox / QA</text>
  </g>

  <g stroke="#93c5fd" stroke-width="3" marker-end="url(#arrow)" fill="none">
    <path d="M260 284 C292 284 305 284 338 284"/>
    <path d="M596 254 C646 224 650 192 690 192"/>
    <path d="M596 286 C646 292 650 320 690 320"/>
    <path d="M596 318 C646 364 650 448 690 448"/>
    <path d="M916 192 C952 180 970 176 1010 176"/>
    <path d="M916 320 C952 320 970 320 1010 320"/>
    <path d="M916 448 C952 456 970 464 1010 464"/>
  </g>

  <rect x="72" y="540" width="1138" height="46" rx="12" fill="#020617" opacity="0.72"/>
  <text x="94" y="570" fill="#e2e8f0" font-family="Inter, Arial, sans-serif" font-size="17">Boundary: DA3 is a geometry prior, not final mesh, collider, semantics, or verified simulator asset.</text>
</svg>
