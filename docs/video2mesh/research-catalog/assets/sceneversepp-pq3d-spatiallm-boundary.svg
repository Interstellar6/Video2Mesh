<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">SceneVerse++ PQ3D SpatialLM boundary</title>
  <desc id="desc">Pipeline diagram showing Video2Mesh geometry feeding SceneVerse++ assets, then PQ3D and SpatialLM producing scene understanding outputs rather than reconstructing geometry.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="1" stop-color="#172033"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" x2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="green" x1="0" x2="1">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#a3e635"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" x2="1">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#fb7185"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect width="1280" height="640" rx="0" fill="url(#bg)"/>
  <text x="64" y="76" fill="#f8fafc" font-family="Inter, Arial, sans-serif" font-size="36" font-weight="700">SceneVerse++ / PQ3D / SpatialLM component boundary</text>
  <text x="64" y="112" fill="#cbd5e1" font-family="Inter, Arial, sans-serif" font-size="18">Geometry is an input asset; PQ3D and SpatialLM add segmentation, layout, and structured scene understanding.</text>

  <g filter="url(#shadow)">
    <rect x="64" y="170" width="284" height="250" rx="18" fill="#0f172a" stroke="#334155"/>
    <rect x="64" y="170" width="284" height="8" rx="4" fill="url(#blue)"/>
    <text x="92" y="222" fill="#f8fafc" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700">Geometry source</text>
    <text x="92" y="262" fill="#cbd5e1" font-family="Inter, Arial, sans-serif" font-size="17">SVPP scene folder</text>
    <text x="92" y="294" fill="#94a3b8" font-family="Inter, Arial, sans-serif" font-size="16">mesh.ply</text>
    <text x="92" y="322" fill="#94a3b8" font-family="Inter, Arial, sans-serif" font-size="16">metadata.json</text>
    <text x="92" y="350" fill="#94a3b8" font-family="Inter, Arial, sans-serif" font-size="16">camera_info.json / frames</text>
    <text x="92" y="386" fill="#fef3c7" font-family="Inter, Arial, sans-serif" font-size="15">Not a released video-to-mesh model</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="498" y="136" width="328" height="190" rx="18" fill="#0f172a" stroke="#334155"/>
    <rect x="498" y="136" width="328" height="8" rx="4" fill="url(#green)"/>
    <text x="526" y="188" fill="#f8fafc" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700">PQ3D</text>
    <text x="526" y="224" fill="#cbd5e1" font-family="Inter, Arial, sans-serif" font-size="17">3D instance segmentation</text>
    <text x="526" y="258" fill="#94a3b8" font-family="Inter, Arial, sans-serif" font-size="16">segmentator + Query3DUnified</text>
    <text x="526" y="286" fill="#94a3b8" font-family="Inter, Arial, sans-serif" font-size="16">point labels, segments, instance ids</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="498" y="374" width="328" height="190" rx="18" fill="#0f172a" stroke="#334155"/>
    <rect x="498" y="374" width="328" height="8" rx="4" fill="url(#amber)"/>
    <text x="526" y="426" fill="#f8fafc" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700">SpatialLM</text>
    <text x="526" y="462" fill="#cbd5e1" font-family="Inter, Arial, sans-serif" font-size="17">3D layout / object detection</text>
    <text x="526" y="496" fill="#94a3b8" font-family="Inter, Arial, sans-serif" font-size="16">Qwen/Llama language tower</text>
    <text x="526" y="524" fill="#94a3b8" font-family="Inter, Arial, sans-serif" font-size="16">Sonata / SceneScript point tower</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="978" y="170" width="238" height="250" rx="18" fill="#0f172a" stroke="#334155"/>
    <rect x="978" y="170" width="238" height="8" rx="4" fill="#a78bfa"/>
    <text x="1006" y="222" fill="#f8fafc" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700">Video2Mesh use</text>
    <text x="1006" y="262" fill="#cbd5e1" font-family="Inter, Arial, sans-serif" font-size="17">semantic sidecar</text>
    <text x="1006" y="294" fill="#94a3b8" font-family="Inter, Arial, sans-serif" font-size="16">object bbox</text>
    <text x="1006" y="322" fill="#94a3b8" font-family="Inter, Arial, sans-serif" font-size="16">scene graph</text>
    <text x="1006" y="350" fill="#94a3b8" font-family="Inter, Arial, sans-serif" font-size="16">spatial QA</text>
    <text x="1006" y="386" fill="#fecaca" font-family="Inter, Arial, sans-serif" font-size="15">Not the visual 3DGS layer</text>
  </g>

  <path d="M 348 248 C 410 248 424 220 498 220" fill="none" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M 348 332 C 410 332 424 468 498 468" fill="none" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M 826 230 C 894 230 910 248 978 248" fill="none" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M 826 468 C 894 468 910 344 978 344" fill="none" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="420" y="32" width="190" height="36" rx="18" fill="#1e293b" stroke="#334155"/>
  <text x="445" y="56" fill="#bae6fd" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700">mesh is input</text>
  <rect x="812" y="32" width="260" height="36" rx="18" fill="#1e293b" stroke="#334155"/>
  <text x="836" y="56" fill="#fecaca" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700">understanding outputs only</text>
</svg>
